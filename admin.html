<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin — Tomahoxs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#cc0000;--dark:#0c0906;--card:#161210;--border:#2a1f1a;--text:#fff5eb;--muted:#9c8878;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--dark);color:var(--text);min-height:100vh}

/* PIN SCREEN */
#pin-screen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;z-index:100;padding:2rem}
#pin-screen.hidden{display:none}
.logo-txt{font-family:'Bebas Neue',cursive;font-size:3rem;letter-spacing:.05em;color:var(--text)}
.logo-sub{font-size:.75rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:-.5rem}
.pin-label{font-size:.85rem;color:var(--muted);text-align:center}
.pin-dots{display:flex;gap:.75rem;justify-content:center}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--border);border:2px solid var(--border);transition:all .15s}
.pin-dot.filled{background:var(--red);border-color:var(--red)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;width:100%;max-width:280px}
.pin-key{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;font-size:1.4rem;font-weight:600;color:var(--text);cursor:pointer;text-align:center;user-select:none;transition:background .1s,transform .08s}
.pin-key:active{background:#1e1510;transform:scale(.94)}
.pin-key.del{font-size:1rem;color:var(--muted)}
.pin-error{color:var(--red);font-size:.85rem;text-align:center;min-height:1.2em}

/* TOKEN SCREEN */
#token-screen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:99;padding:2rem}
#token-screen.hidden{display:none}
.token-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:1rem}
.token-title{font-size:1.1rem;font-weight:700}
.token-desc{font-size:.82rem;color:var(--muted);line-height:1.5}
.token-input{background:#0a0705;border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.85rem;width:100%;font-family:monospace;outline:none}
.token-input:focus{border-color:rgba(204,0,0,.5)}
.btn-primary{background:var(--red);color:#fff;border:none;border-radius:8px;padding:.85rem;font-size:.95rem;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn-primary:hover{opacity:.88}
.btn-primary:active{opacity:.75}

/* MAIN */
#main{display:none;padding:1.25rem;max-width:800px;margin:0 auto}
#main.visible{display:block}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.top-logo{font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:.05em}
.top-sub{font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.btn-logout{background:transparent;border:1px solid var(--border);border-radius:8px;padding:.4rem .9rem;color:var(--muted);font-size:.78rem;cursor:pointer}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.section-label{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:.05em;color:var(--text);margin:1.75rem 0 .85rem;padding-bottom:.4rem;border-bottom:2px solid var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}

.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:border-color .2s,transform .15s}
.item-card:hover{border-color:rgba(204,0,0,.4);transform:translateY(-2px)}
.item-card:active{transform:scale(.97)}
.item-card input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:20}

.img-wrap{position:relative;width:100%;padding-top:75%;background:#0a0705;overflow:hidden}
.img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.img-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;border:2px dashed var(--border)}
.img-placeholder svg{width:28px;height:28px;opacity:.3}
.img-placeholder span{font-size:.7rem;color:var(--muted);text-align:center;padding:0 .5rem}

.item-info{padding:.6rem .7rem .7rem}
.item-name{font-size:.82rem;font-weight:600;line-height:1.3;margin-bottom:.35rem}
.item-status{display:flex;align-items:center;gap:.3rem;font-size:.7rem}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.has{background:#22c55e}
.status-dot.missing{background:var(--border)}
.status-txt{color:var(--muted)}

/* UPLOAD OVERLAY */
.upload-overlay{position:absolute;inset:0;background:rgba(12,9,6,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;z-index:10;border-radius:var(--r);backdrop-filter:blur(2px)}
.upload-overlay.hidden{display:none}
.upload-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
.upload-msg{font-size:.75rem;color:var(--muted)}
.upload-success{color:#22c55e;font-size:.75rem;font-weight:600}
.upload-error{color:var(--red);font-size:.75rem;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1.25rem;font-size:.85rem;font-weight:500;opacity:0;transition:all .3s;z-index:200;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:#22c55e;color:#22c55e}
.toast.err{border-color:var(--red);color:var(--red)}

/* HUB */
#hub-screen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2rem;z-index:200}
#hub-screen.hidden{display:none}
.hub-logo{text-align:center}
.hub-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:400px}
.hub-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.85rem;cursor:pointer;transition:border-color .2s,transform .15s;text-decoration:none;color:var(--text)}
.hub-card:hover{border-color:rgba(204,0,0,.5);transform:translateY(-3px)}
.hub-card:active{transform:scale(.96)}
.hub-card svg{width:36px;height:36px;color:var(--red);opacity:.9}
.hub-card-title{font-family:'Bebas Neue',cursive;font-size:1.3rem;letter-spacing:.06em;text-align:center}
.hub-card-sub{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.4}
</style>
</head>
<body>

<!-- HUB SCREEN -->
<div id="hub-screen">
  <div class="hub-logo">
    <div class="logo-txt">TOMAHOXS</div>
    <div class="logo-sub">Panel Admin</div>
  </div>
  <div class="hub-cards">
    <a class="hub-card" href="/facturas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      <div class="hub-card-title">Contable</div>
      <div class="hub-card-sub">Facturas, P&L y costos del mes</div>
    </a>
    <div class="hub-card" onclick="goFotos()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <div class="hub-card-title">Fotos Menú</div>
      <div class="hub-card-sub">Subir y actualizar fotos de los platos</div>
    </div>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="pin-screen" class="hidden">
  <div style="text-align:center;margin-bottom:2rem">
    <div class="logo-txt">TOMAHOXS</div>
    <div class="logo-sub">Fotos del Menú</div>
  </div>
  <form id="login-form" onsubmit="checkLogin(event)" style="display:flex;flex-direction:column;gap:.85rem;width:100%;max-width:320px">
    <input id="login-user" type="text" placeholder="Usuario" autocomplete="username"
      style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;width:100%;box-sizing:border-box">
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password"
      style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;width:100%;box-sizing:border-box">
    <button type="submit"
      style="background:var(--red);color:#fff;border:none;border-radius:var(--r);padding:.95rem;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:.08em;cursor:pointer">
      INGRESAR
    </button>
    <div id="login-error" style="color:var(--red);font-size:.82rem;text-align:center;min-height:1rem"></div>
  </form>
</div>


<!-- MAIN -->
<div id="main">
  <div class="top-bar">
    <div>
      <div class="top-logo">TOMAHOXS</div>
      <div class="top-sub">Fotos del menú</div>
    </div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
  <div id="grid-container"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PIN = '2121'; // usado solo para el webhook de subida de fotos
const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwjcOs15KtXkLW4-7fOl_6Tks8D_cRlvfM1PcOUp1v6VwjqBG9y4zyQMkgSYkue6HYj9Q/exec';
const UPLOAD_URL = 'https://primary-production-74bce.up.railway.app/webhook/upload-foto-menu';

let currentUser = null;
let currentPass = null;

const SECTIONS = [
  { label: 'Entradas', items: [
    { id:'bocaditos',   name:'Bocaditos de Reina' },
    { id:'taquitos',    name:'Taquitos Ahumados' },
    { id:'tostones',    name:'Tostones Ahumados' },
    { id:'nachos',      name:'Pulled Nachos' },
    { id:'chicharron',  name:'Chicharrón 300g' },
    { id:'costilla',    name:'Costilla 450g' },
  ]},
  { label: 'Perrito', items: [
    { id:'perrito',     name:'Perrito Ahumado' },
  ]},
  { label: 'Hamburguesas', items: [
    { id:'chic-candy',  name:'Chic-Candy' },
    { id:'toffee',      name:'Toffee' },
    { id:'romanoff',    name:'Romanoff' },
    { id:'welsh',       name:'The Welsh' },
    { id:'smoky',       name:'Smoky' },
    { id:'philabrisk',  name:'Philabrisk' },
    { id:'epik',        name:'EPIK' },
    { id:'monotov',     name:'Monotov' },
    { id:'philadelphia',name:'Philadelphia' },
    { id:'cheese-bacon',name:'Cheese Bacon' },
    { id:'clasica',     name:'Clásica' },
  ]},
  { label: 'Papas', items: [
    { id:'pulled-papas',name:'Pulled Papas' },
    { id:'papas-solas', name:'Papas Solas' },
  ]},
  { label: 'Cortes al Barril', items: [
    { id:'punta-anca',  name:'Punta de Anca' },
    { id:'churrasco',   name:'Churrasco' },
    { id:'solomo',      name:'Solomo Extranjero' },
    { id:'pincho',      name:'Pincho de Pollo' },
  ]},
];

// Login
async function checkLogin(e) {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.querySelector('#login-form button[type=submit]');
  const err = document.getElementById('login-error');
  if (!user || !pass) { err.textContent = 'Completa todos los campos'; return; }
  btn.textContent = 'VERIFICANDO...'; btn.disabled = true; err.textContent = '';
  try {
    const url = new URL(APPS_SCRIPT);
    url.searchParams.set('action', 'checkAdminAuth');
    url.searchParams.set('payload', JSON.stringify({ user, pass }));
    const res = await fetch(url.toString(), { credentials: 'omit' });
    const data = await res.json();
    if (data.ok) {
      currentUser = user; currentPass = pass;
      document.getElementById('pin-screen').classList.add('hidden');
      showMain();
    } else {
      err.textContent = 'Usuario o contraseña incorrectos';
    }
  } catch(ex) {
    err.textContent = 'Error de conexión. Intenta de nuevo.';
  }
  btn.textContent = 'INGRESAR'; btn.disabled = false;
}

function goFotos() {
  document.getElementById('hub-screen').classList.add('hidden');
  document.getElementById('pin-screen').classList.remove('hidden');
}

function logout() {
  location.reload();
}

// Main grid
function showMain() {
  const main = document.getElementById('main');
  main.classList.add('visible');
  const container = document.getElementById('grid-container');
  container.innerHTML = SECTIONS.map(s => `
    <div class="section-label">${s.label}</div>
    <div class="grid">${s.items.map(itemCard).join('')}</div>
  `).join('') + `
  <div class="section-label" style="margin-top:2rem">Usuarios</div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;max-width:340px">
    <form onsubmit="crearUsuario(event)" style="display:flex;flex-direction:column;gap:.75rem">
      <input id="nu-user" type="text" placeholder="Nuevo usuario"
        style="background:#0a0705;border:1px solid var(--border);border-radius:8px;padding:.7rem .9rem;color:var(--text);font-size:.9rem;outline:none">
      <input id="nu-pass" type="password" placeholder="Contraseña"
        style="background:#0a0705;border:1px solid var(--border);border-radius:8px;padding:.7rem .9rem;color:var(--text);font-size:.9rem;outline:none">
      <button type="submit" style="background:var(--red);color:#fff;border:none;border-radius:8px;padding:.75rem;font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:.06em;cursor:pointer">CREAR USUARIO</button>
      <div id="nu-msg" style="font-size:.8rem;text-align:center;min-height:1rem"></div>
    </form>
  </div>`;
  SECTIONS.forEach(s => s.items.forEach(item => checkImgExists(item.id)));
  document.querySelectorAll('.item-card input[type=file]').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = inp.dataset.id;
      if (e.target.files[0]) handleUpload(id, e.target.files[0]);
    });
  });
}

async function crearUsuario(e) {
  e.preventDefault();
  const newUser = document.getElementById('nu-user').value.trim();
  const newPass = document.getElementById('nu-pass').value;
  const msg = document.getElementById('nu-msg');
  const btn = e.target.querySelector('button');
  if (!newUser || !newPass) { msg.style.color = 'var(--red)'; msg.textContent = 'Completa ambos campos'; return; }
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Guardando...';
  try {
    const url = new URL(APPS_SCRIPT);
    url.searchParams.set('action', 'createAdminUser');
    url.searchParams.set('payload', JSON.stringify({ currentUser, currentPass, newUser, newPass }));
    const res = await fetch(url.toString(), { credentials: 'omit' });
    const data = await res.json();
    if (data.ok) {
      msg.style.color = '#22c55e'; msg.textContent = '✓ Usuario creado';
      document.getElementById('nu-user').value = '';
      document.getElementById('nu-pass').value = '';
    } else {
      msg.style.color = 'var(--red)'; msg.textContent = data.error || 'Error al crear usuario';
    }
  } catch(ex) {
    msg.style.color = 'var(--red)'; msg.textContent = 'Error de conexión';
  }
  btn.disabled = false;
}

function itemCard(item) {
  return `
  <div class="item-card" id="card-${item.id}">
    <input type="file" accept="image/*" capture="environment" data-id="${item.id}">
    <div class="img-wrap" id="wrap-${item.id}">
      <div class="img-placeholder" id="ph-${item.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <span>Toca para subir</span>
      </div>
      <img id="img-${item.id}" src="" alt="${item.name}" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <div class="upload-overlay hidden" id="ov-${item.id}">
        <div class="upload-spinner"></div>
        <div class="upload-msg">Subiendo...</div>
      </div>
    </div>
    <div class="item-info">
      <div class="item-name">${item.name}</div>
      <div class="item-status">
        <div class="status-dot missing" id="dot-${item.id}"></div>
        <div class="status-txt" id="st-${item.id}">Sin foto</div>
      </div>
    </div>
  </div>`;
}

function checkImgExists(id) {
  const img = document.getElementById('img-' + id);
  const ph  = document.getElementById('ph-' + id);
  const url = '/img/' + id + '.jpg?v=' + Date.now();
  const test = new Image();
  test.onload = () => { img.src = url; img.style.display = 'block'; ph.style.display = 'none'; setStatus(id, true); };
  test.onerror = () => setStatus(id, false);
  test.src = url;
}

function setStatus(id, has) {
  const dot = document.getElementById('dot-' + id);
  const st  = document.getElementById('st-' + id);
  if (!dot) return;
  dot.className = 'status-dot ' + (has ? 'has' : 'missing');
  st.textContent = has ? 'Foto lista' : 'Sin foto';
}

// Image resize
function resizeImage(file, maxW = 1200, q = 0.88) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          const r2 = new FileReader();
          r2.onload = e2 => resolve(e2.target.result.split(',')[1]);
          r2.readAsDataURL(blob);
        }, 'image/jpeg', q);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Upload via n8n webhook (token queda server-side)
async function handleUpload(id, file) {
  const ov = document.getElementById('ov-' + id);
  ov.classList.remove('hidden');
  ov.innerHTML = '<div class="upload-spinner"></div><div class="upload-msg">Procesando...</div>';

  try {
    const b64 = await resizeImage(file);
    ov.querySelector('.upload-msg').textContent = 'Subiendo...';

    const res = await fetch(UPLOAD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: PIN, id, content: b64 })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(pe) { throw new Error('Respuesta inválida: ' + text.substring(0, 80)); }
    if (!data.ok) throw new Error(data.error || data.message || JSON.stringify(data));

    const url = '/img/' + id + '.jpg?v=' + Date.now();
    const img = document.getElementById('img-' + id);
    const ph  = document.getElementById('ph-' + id);
    img.src = url; img.style.display = 'block'; ph.style.display = 'none';
    setStatus(id, true);
    ov.innerHTML = '<div class="upload-success">✓ Subida</div>';
    setTimeout(() => ov.classList.add('hidden'), 1500);
    showToast('✓ ' + id + ' actualizado', 'ok');
  } catch(e) {
    ov.innerHTML = '<div class="upload-error">Error: ' + e.message + '</div>';
    setTimeout(() => ov.classList.add('hidden'), 2500);
    showToast('Error al subir ' + id, 'err');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast ' + type, 2500);
}
</script>
</body>
</html>
