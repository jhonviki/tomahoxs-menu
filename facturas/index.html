<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.sheetjs.com; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomahoxs — Facturas</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8440A">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://generativelanguage.googleapis.com">
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sb-logo">TOMA</div>
    <a class="sb-item active" data-screen="dashboard" href="#dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="lbl">DASH</span>
    </a>
    <a class="sb-item" data-screen="scan" href="#scan">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
      <span class="lbl">SCAN</span>
    </a>
    <div class="sb-divider"></div>
    <a class="sb-item" data-screen="historial" href="#historial">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 0 2-2h2a2 2 0 0 0 2 2"/></svg>
      <span class="lbl">HIST</span>
    </a>
    <a class="sb-item" data-screen="recetas" href="#recetas">
      <svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span class="lbl">RECETAS</span>
    </a>
    <a class="sb-item" data-screen="costos" href="#costos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="lbl">P&L</span>
    </a>
    <div class="sb-divider"></div>
    <a class="sb-item" data-screen="inventario" href="#inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 3v18M2 9h6M2 15h6M8 9h14M8 15h14"/></svg>
      <span class="lbl">INV</span>
    </a>
    <a class="sb-item" data-screen="libro" href="#libro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span class="lbl">LIBRO</span>
    </a>
    <div class="sb-avatar">JH</div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div id="screen-dashboard" class="screen active"></div>
    <div id="screen-scan" class="screen"></div>
    <div id="screen-historial" class="screen"></div>
    <div id="screen-recetas" class="screen"></div>
    <div id="screen-costos" class="screen"></div>
    <div id="screen-inventario" class="screen"></div>
    <div id="screen-libro" class="screen"></div>
  </div>
</div>

<div id="toast"></div>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">TOMA</div>
    <div class="login-sub">Facturas & Costos</div>
    <form id="login-form">
      <div class="login-field">
        <label>Usuario</label>
        <input id="login-user" type="text" autocomplete="username" placeholder="admin / operario" required>
      </div>
      <div class="login-field">
        <label>Contraseña</label>
        <input id="login-pass" type="password" autocomplete="current-password" required>
      </div>
      <div id="login-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">INGRESAR</button>
    </form>
  </div>
</div>

<style>
#login-overlay {
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(10,10,10,.97);
  align-items:center;justify-content:center;
}
#login-overlay.visible { display:flex; }
.login-box {
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:40px 32px;width:100%;max-width:340px;
}
.login-logo {
  font-family:'Bebas Neue',sans-serif;font-size:2.8rem;color:var(--fire);
  letter-spacing:.1em;text-align:center;margin-bottom:4px;
}
.login-sub {
  font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--steel);
  letter-spacing:2px;text-align:center;text-transform:uppercase;margin-bottom:28px;
}
.login-field { margin-bottom:14px; }
.login-field label {
  display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;
  color:var(--steel);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;
}
.login-field input {
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:10px 12px;color:var(--bone);
  font-family:'IBM Plex Mono',monospace;font-size:12px;box-sizing:border-box;
}
.login-field input:focus { outline:none;border-color:var(--fire); }
#login-error {
  font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--fire);
  min-height:16px;margin-bottom:4px;text-align:center;
}
</style>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/api.js"></script>
<script src="js/screens/dashboard.js"></script>
<script src="js/screens/scan.js"></script>
<script src="js/screens/historial.js"></script>
<script src="js/screens/recetas.js"></script>
<script src="js/screens/costos.js"></script>
<script src="js/screens/inventario.js"></script>
<script src="js/screens/libro.js"></script>
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
